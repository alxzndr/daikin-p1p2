# Build every firmware the fork can ship, on every PR and on main.
#
# Part of the P1P2MQTT fork (https://github.com/alxzndr/daikin-p1p2).
# License: CC BY-NC-ND 4.0 with the exceptions in LICENSE.md.
#
# This workflow is read-only with respect to the heating system: it only compiles.
# It needs no secrets and never contacts the bridge or an MQTT broker.
name: Build firmware

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so CI builds with the same PlatformIO Core the fork is developed with.
  PLATFORMIO_VERSION: "6.1.18"

jobs:
  esp8266:
    name: ESP8266 bridge / ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        env: [Daikin-E-USB, Daikin-F-USB]
    defaults:
      run:
        working-directory: examples/P1P2MQTT-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade "platformio==${PLATFORMIO_VERSION}"

      - name: Restore PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-esp8266-${{ matrix.env }}-${{ hashFiles('examples/P1P2MQTT-bridge/platformio.ini', 'OSS-dependencies/**', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-pio-esp8266-${{ matrix.env }}-

      - name: Build ${{ matrix.env }}
        shell: bash
        run: |
          set -o pipefail
          pio run -e "${{ matrix.env }}" 2>&1 | tee "$RUNNER_TEMP/build-${{ matrix.env }}.log"

      - name: Report firmware version and flash/RAM usage
        if: ${{ !cancelled() }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/firmware_summary.sh" "${{ matrix.env }}" \
          "$RUNNER_TEMP/build-${{ matrix.env }}.log" \
          ".pio/build/${{ matrix.env }}/firmware.bin"

      - name: Upload E-series binary + SHA-256
        if: matrix.env == 'Daikin-E-USB'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-Daikin-E-USB-${{ github.sha }}
          path: |
            examples/P1P2MQTT-bridge/.pio/build/Daikin-E-USB/firmware.bin
            examples/P1P2MQTT-bridge/.pio/build/Daikin-E-USB/firmware.bin.sha256
          if-no-files-found: error
          retention-days: 30

  atmega:
    name: ATmega328P monitor / Daikin-E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/P1P2Monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade "platformio==${PLATFORMIO_VERSION}"

      - name: Restore PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-atmelavr-${{ hashFiles('examples/P1P2Monitor/platformio.ini', 'P1P2MQTT.cpp', 'P1P2MQTT.h', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-pio-atmelavr-

      - name: Build Daikin-E
        shell: bash
        run: |
          set -o pipefail
          pio run -e Daikin-E 2>&1 | tee "$RUNNER_TEMP/build-Daikin-E.log"

      - name: Report firmware version and flash/RAM usage
        if: ${{ !cancelled() }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/firmware_summary.sh" "Daikin-E" \
          "$RUNNER_TEMP/build-Daikin-E.log" \
          ".pio/build/Daikin-E/firmware.hex"

  shellcheck:
    name: shellcheck tools/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        shell: bash
        run: |
          set -o pipefail
          # shellcheck is preinstalled on ubuntu-latest; keep a fallback so the job
          # does not silently pass on an image change.
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          files=$(find tools .github/scripts -name '*.sh' -print)
          test -n "$files"
          # shellcheck disable=SC2086
          shellcheck -S warning $files
